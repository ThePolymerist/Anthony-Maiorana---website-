name: Refresh Polymerist articles
on:
  schedule:
    - cron: '17 13 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: refresh-writing
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: node scripts/sync-feed.mjs --strict
      - run: npm run check && npm test && npm run build:offline && node scripts/check-output.mjs
      - name: Commit only changed article data
        shell: bash
        run: |
          if git diff --quiet -- src/data/writing.json; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/data/writing.json
          git commit -m 'Refresh Polymerist article index'
          git push origin HEAD:main
